<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kasey's Hub — Student Login</title>
<meta name="robots" content="noindex, nofollow">
<style>
  body{margin:0; font-family:Helvetica,Arial,sans-serif; background:#f6f4ef; color:#2b2b33; display:flex; align-items:center; justify-content:center; min-height:100vh;}
  .gate{background:#fff; border:1px solid #e2ddd2; border-radius:18px; padding:44px 40px; max-width:380px; width:92%; text-align:center; box-shadow:0 20px 50px -20px rgba(51,38,43,.25);}
  h1{font-family:Georgia,serif; font-size:26px; margin:0 0 6px;}
  h1 span{color:#8A2F4A; font-style:italic;}
  p.sub{color:#6d6d7a; font-size:14px; margin:0 0 26px;}
  label{display:block; text-align:left; font-size:12px; font-weight:bold; letter-spacing:.8px; color:#6d6d7a; margin:14px 0 5px;}
  input{width:100%; box-sizing:border-box; padding:12px 14px; font-size:15px; border:1.5px solid #d8d3c8; border-radius:10px; outline:none;}
  input:focus{border-color:#4f7a52;}
  button{width:100%; margin-top:22px; background:#4f7a52; color:#fff; border:none; border-radius:100px; padding:14px; font-size:15px; font-weight:bold; cursor:pointer;}
  button:hover{background:#3e5641;}
  .err{color:#a05252; font-size:13px; margin-top:12px; min-height:18px;}
  .lock{font-size:30px; margin-bottom:10px;}
</style>
</head>
<body>
<div class="gate">
  <div class="lock">🔒</div>
  <h1>Kasey's <span>Hub</span></h1>
  <p class="sub">For enrolled students. Enter your login to continue.</p>
  <form id="f">
    <label>USERNAME</label><input id="u" autocomplete="username" autocapitalize="none">
    <label>PASSWORD</label><input id="p" type="password" autocomplete="current-password">
    <button type="submit">Open the Hub</button>
    <div class="err" id="e"></div>
  </form>
</div>
